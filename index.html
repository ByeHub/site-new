<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Manager Hub - Premium Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 100%);
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }
    .glass {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
      100% { transform: translateY(0px); }
    }
    .floating {
      animation: float 4s ease-in-out infinite;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade {
      animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 sm:p-8">

  <!-- Header -->
  <header class="w-full max-w-4xl mb-6 flex justify-between items-center border-b border-slate-800/80 pb-4 animate-fade">
    <h1 class="text-2xl sm:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-rose-400 to-pink-500 flex items-center gap-2.5">
      <i class="fa-solid fa-photo-film text-red-500"></i> Post Manager Hub
    </h1>
    <div id="authSection">
      <button onclick="openLoginModal()" class="bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-700 hover:to-rose-700 text-white font-semibold px-4 py-2 rounded-xl transition duration-300 shadow-lg shadow-red-600/30 flex items-center gap-2 text-sm transform hover:scale-105">
        <i class="fa-solid fa-lock"></i> Admin Login
      </button>
    </div>
  </header>

  <!-- Top Stats Banner (Animated Counter Display) -->
  <section class="w-full max-w-4xl grid grid-cols-2 gap-4 mb-8 animate-fade">
    <div class="glass p-5 rounded-2xl shadow-xl flex items-center gap-4 border-l-4 border-red-500 floating">
      <div class="w-12 h-12 bg-red-500/10 text-red-500 rounded-xl flex items-center justify-center text-xl shadow-inner">
        <i class="fa-solid fa-layer-group"></i>
      </div>
      <div>
        <p class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Total Posts</p>
        <h3 id="totalPostsCount" class="text-2xl font-bold text-white">0</h3>
      </div>
    </div>
    <div class="glass p-5 rounded-2xl shadow-xl flex items-center gap-4 border-l-4 border-indigo-500 floating" style="animation-delay: 2s;">
      <div class="w-12 h-12 bg-indigo-500/10 text-indigo-400 rounded-xl flex items-center justify-center text-xl shadow-inner">
        <i class="fa-solid fa-eye"></i>
      </div>
      <div>
        <p class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Total Views</p>
        <h3 id="totalViewsCount" class="text-2xl font-bold text-white">0</h3>
      </div>
    </div>
  </section>

  <main class="w-full max-w-4xl flex flex-col gap-8">
    
    <!-- Upload Form (Admin Only) -->
    <section id="uploadSection" class="glass p-6 sm:p-8 rounded-3xl shadow-2xl hidden animate-fade relative overflow-hidden">
      <div class="absolute -right-10 -top-10 w-40 h-40 bg-red-500/10 rounded-full blur-3xl pointer-events-none"></div>
      
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-bold text-white flex items-center gap-2.5">
          <i class="fa-solid fa-pen-nib text-red-500"></i> නව Post එකක් එකතු කරන්න
        </h2>
        <button onclick="logoutAdmin()" class="text-xs text-red-400 hover:text-red-300 underline font-medium">Logout</button>
      </div>
      
      <form id="postForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Post Title (මාතෘකාව)</label>
          <input type="text" id="postTitle" placeholder="මාතෘකාව ඇතුළත් කරන්න..." required
            class="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-red-500 transition shadow-inner">
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Video Link (URL)</label>
          <input type="url" id="videoLink" placeholder="https://youtube.com/..." required
            class="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-red-500 transition shadow-inner">
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Image Link / Direct Image URL</label>
          <input type="url" id="imageUrl" placeholder="https://example.com/image.jpg" required
            class="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-red-500 transition shadow-inner">
        </div>

        <button type="submit" id="submitBtn"
          class="w-full bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-700 hover:to-rose-700 text-white font-bold py-3.5 px-4 rounded-xl transition duration-300 transform hover:-translate-y-0.5 shadow-lg shadow-red-600/30 flex items-center justify-center gap-2">
          <i class="fa-solid fa-cloud-arrow-up"></i> Post එක Save කර Telegram යවන්න
        </button>
      </form>

      <!-- Send All Posts to Telegram Button -->
      <div class="mt-4 pt-4 border-t border-slate-800">
        <button id="sendAllBtn" onclick="sendAllPostsToTelegram()"
          class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-3 px-4 rounded-xl transition duration-300 shadow-lg shadow-blue-600/30 flex items-center justify-center gap-2 text-sm">
          <i class="fa-brands fa-telegram text-lg"></i> සියලුම Posts Telegram වෙත එකවර යවන්න (Send All)
        </button>
      </div>
    </section>

    <!-- Post Live Feed Section -->
    <section class="glass p-6 sm:p-8 rounded-3xl shadow-2xl animate-fade">
      <h2 class="text-xl font-bold mb-6 text-white flex items-center gap-2.5">
        <i class="fa-solid fa-fire text-red-500"></i> සියලුම Posts (Feed)
      </h2>
      <div id="postsFeed" class="grid grid-cols-1 sm:grid-cols-2 gap-6">
        <p id="loadingMessage" class="text-slate-400 text-center py-12 col-span-full">Posts Load වෙමින් පවතී...</p>
      </div>
    </section>

  </main>

  <!-- Login Modal -->
  <div id="loginModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4 z-50 animate-fade">
    <div class="glass p-8 rounded-3xl shadow-2xl w-full max-w-md relative border border-slate-700/80">
      <button onclick="closeLoginModal()" class="absolute top-5 right-5 text-slate-400 hover:text-white text-lg">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <h3 class="text-2xl font-bold text-white mb-6 flex items-center gap-2.5">
        <i class="fa-solid fa-user-lock text-red-500"></i> Admin Login
      </h3>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Username</label>
          <input type="text" id="adminUser" placeholder="Enter username" required
            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-red-500 transition">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Password</label>
          <input type="password" id="adminPass" placeholder="Enter password" required
            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-red-500 transition">
        </div>
        <p id="loginError" class="text-red-400 text-xs font-medium hidden">Username හෝ Password වැරදියි!</p>
        <button type="submit" 
          class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 rounded-xl transition duration-300 shadow-lg shadow-red-600/30">
          Login
        </button>
      </form>
    </div>
  </div>

  <!-- Firebase SDK & App Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, increment, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCyTD7VTx-zBy7gZ2UKdpJyGB0353AnH44",
      authDomain: "site-new-5f63d.firebaseapp.com",
      projectId: "site-new-5f63d",
      storageBucket: "site-new-5f63d.firebasestorage.app",
      messagingSenderId: "589203876926",
      appId: "1:589203876926:web:310665df1fddd2440cf56f",
      measurementId: "G-D2JYZG9L1L"
    };

    const TELEGRAM_BOT_TOKEN = "9071788238:AAH3IpjOMFE2vG82RG3w8bZlA2CSnR0u4Ac";
    const TELEGRAM_CHAT_ID = "-1003951414350";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const postForm = document.getElementById('postForm');
    const postsFeed = document.getElementById('postsFeed');
    const submitBtn = document.getElementById('submitBtn');
    const uploadSection = document.getElementById('uploadSection');
    const authSection = document.getElementById('authSection');
    const totalPostsCount = document.getElementById('totalPostsCount');
    const totalViewsCount = document.getElementById('totalViewsCount');

    function checkAuth() {
      const isLoggedIn = sessionStorage.getItem('isAdminLoggedIn');
      if (isLoggedIn === 'true') {
        uploadSection.classList.remove('hidden');
        authSection.innerHTML = `<span class="text-green-400 text-xs font-bold flex items-center gap-1.5 bg-green-500/10 px-3.5 py-2 rounded-xl border border-green-500/20 shadow-inner"><i class="fa-solid fa-circle-check"></i> Admin Logged In</span>`;
      } else {
        uploadSection.classList.add('hidden');
        authSection.innerHTML = `<button onclick="openLoginModal()" class="bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-700 hover:to-rose-700 text-white font-semibold px-4 py-2 rounded-xl transition duration-300 shadow-lg shadow-red-600/30 flex items-center gap-2 text-sm transform hover:scale-105"><i class="fa-solid fa-lock"></i> Admin Login</button>`;
      }
    }
    window.checkAuth = checkAuth;
    checkAuth();

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const u = document.getElementById('adminUser').value;
      const p = document.getElementById('adminPass').value;
      const err = document.getElementById('loginError');

      if (u === 'chathumal' && p === 'aaaa1234') {
        sessionStorage.setItem('isAdminLoggedIn', 'true');
        closeLoginModal();
        checkAuth();
        err.classList.add('hidden');
        document.getElementById('loginForm').reset();
      } else {
        err.classList.remove('hidden');
      }
    });

    window.logoutAdmin = function() {
      sessionStorage.removeItem('isAdminLoggedIn');
      checkAuth();
    }

    window.openLoginModal = function() {
      document.getElementById('loginModal').classList.remove('hidden');
    }
    window.closeLoginModal = function() {
      document.getElementById('loginModal').classList.add('hidden');
    }

    // Realtime Database Fetch & Counter Calculation
    const postsQuery = query(collection(db, "posts"), orderBy("createdAt", "desc"));

    onSnapshot(postsQuery, (snapshot) => {
      postsFeed.innerHTML = "";

      if (snapshot.empty) {
        postsFeed.innerHTML = `<p class="text-slate-400 text-center py-12 col-span-full">තවම Post එකක් එකතු කර නැත.</p>`;
        totalPostsCount.innerText = "0";
        totalViewsCount.innerText = "0";
        return;
      }

      totalPostsCount.innerText = snapshot.size;
      let totalViews = 0;

      snapshot.forEach((docSnap) => {
        const post = docSnap.data();
        const postId = docSnap.id;
        const views = post.views || 0;
        totalViews += views;

        createPostCard(postId, post.title, post.videoLink, post.imageUrl, views);
      });

      totalViewsCount.innerText = totalViews;
    });

    // Increment View Count Function
    window.incrementView = async function(postId, videoLink) {
      try {
        const postRef = doc(db, "posts", postId);
        await updateDoc(postRef, {
          views: increment(1)
        });
      } catch (e) {
        console.error("Error updating views: ", e);
      }
      window.open(videoLink, '_blank');
    }

    async function sendTelegramNotification(title, videoLink, imageUrl) {
      const captionText = 
        `🔥 <b>NEW UPDATE PUBLISHED!</b> 🔥\n` +
        `━━━━━━━━━━━━━━━━━━━\n` +
        `📌 <b>Title:</b> <code>${title}</code>\n\n` +
        `🎬 <b>Watch Now:</b> <a href="${videoLink}">Click Here to Watch</a>\n` +
        `━━━━━━━━━━━━━━━━━━━\n` +
        `✨ <i>Stay tuned for more updates!</i>`;

      const telegramUrl = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`;

      try {
        await fetch(telegramUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: TELEGRAM_CHAT_ID,
            photo: imageUrl,
            caption: captionText,
            parse_mode: 'HTML'
          })
        });
      } catch (err) {
        console.error("Telegram API Error:", err);
      }
    }

    window.sendAllPostsToTelegram = async function() {
      const sendAllBtn = document.getElementById('sendAllBtn');
      sendAllBtn.disabled = true;
      sendAllBtn.innerText = "සියලුම Posts යවමින් පවතී... ටිකක් රැඳී සිටින්න";

      try {
        const querySnapshot = await getDocs(collection(db, "posts"));
        if (querySnapshot.empty) {
            alert("Database එකේ Posts කිසිවක් නැත!");
            sendAllBtn.disabled = false;
            sendAllBtn.innerHTML = `<i class="fa-brands fa-telegram text-lg"></i> සියලුම Posts Telegram වෙත එකවර යවන්න (Send All)`;
            return;
        }

        let count = 0;
        for (const docSnap of querySnapshot.docs) {
            const post = docSnap.data();
            if (post.title && post.videoLink && post.imageUrl) {
                await sendTelegramNotification(post.title, post.videoLink, post.imageUrl);
                count++;
                await new Promise(resolve => setTimeout(resolve, 1000));
            }
        }

        alert(`සාර්ථකයි! Posts ${count} ක් Telegram වෙත යවන ලදී.`);
      } catch (error) {
        console.error("Error sending all posts: ", error);
        alert("Posts යැවීමේදී දෝෂයක් ඇති විය!");
      } finally {
        sendAllBtn.disabled = false;
        sendAllBtn.innerHTML = `<i class="fa-brands fa-telegram text-lg"></i> සියලුම Posts Telegram වෙත එකවර යවන්න (Send All)`;
      }
    };

    postForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const title = document.getElementById('postTitle').value;
      const videoLink = document.getElementById('videoLink').value;
      const imageUrl = document.getElementById('imageUrl').value;

      submitBtn.disabled = true;
      submitBtn.innerText = "Save වෙමින් සහ Telegram යවමින්...";

      try {
        await addDoc(collection(db, "posts"), {
          title: title,
          videoLink: videoLink,
          imageUrl: imageUrl,
          views: 0,
          createdAt: serverTimestamp()
        });

        await sendTelegramNotification(title, videoLink, imageUrl);

        postForm.reset();
      } catch (error) {
        console.error("Error adding document: ", error);
        alert("පෝස්ට් එක Save කිරීමේදී දෝෂයක් ආවා!");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Post එක Save කර Telegram යවන්න`;
      }
    });

    function createPostCard(postId, title, videoLink, imageUrl, views) {
      const card = document.createElement('div');
      card.className = "glass-card border border-slate-700/60 rounded-2xl overflow-hidden shadow-xl flex flex-col transition duration-300 transform hover:-translate-y-1 hover:shadow-2xl hover:border-slate-600";

      card.innerHTML = `
        <div class="relative h-48 w-full bg-slate-950 overflow-hidden">
          <img src="${imageUrl}" alt="${title}" class="w-full h-full object-cover transition duration-500 hover:scale-110" onerror="this.src='https://via.placeholder.com/400x200?text=No+Image'">
          <div class="absolute top-3 right-3 bg-slate-900/80 backdrop-blur-md border border-slate-700 text-slate-200 text-xs font-bold px-3 py-1.5 rounded-full shadow-lg flex items-center gap-1.5">
            <i class="fa-solid fa-eye text-red-500"></i> <span>${views} Views</span>
          </div>
        </div>
        <div class="p-5 flex flex-col justify-between flex-grow">
          <h3 class="text-base font-bold text-white mb-4 line-clamp-2 leading-snug">${title}</h3>
          <button onclick="incrementView('${postId}', '${videoLink}')"
            class="w-full inline-flex items-center justify-center gap-2 bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-700 hover:to-rose-700 text-white font-semibold py-2.5 px-4 rounded-xl transition duration-300 text-sm shadow-md shadow-red-600/20">
            <i class="fa-solid fa-play"></i> Watch Video
          </button>
        </div>
      `;

      postsFeed.appendChild(card);
    }
  </script>
</body>
</html>
